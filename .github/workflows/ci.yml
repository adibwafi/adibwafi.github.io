name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege: this workflow only reads the repo. (Repo-wide default is
# also read-only; this keeps it that way even if that setting changes.)
permissions:
  contents: read

# A newer push to the same ref supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single consolidated pipeline job
  pipeline:
    name: 🚀 Build, Test & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # ── Single Production Build ─────────────────────────────
      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

      # ── Lighthouse CI Audit ────────────────────────────────
      - name: Start production server for Lighthouse
        run: npm start &

      - name: Wait for server ready
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'

      - name: Run Lighthouse CI
        # Third-party action pinned to a commit SHA (v11); Dependabot keeps it current.
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: '.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

      # ── Security Audit ─────────────────────────────────────
      - name: Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
