<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="100%" height="100%" fill="none" aria-hidden="true">
  <defs>
    <!-- Template Twin Frame Pair -->
    <g id="twin-frame-pair">
      <rect x="0" y="0" width="44" height="44" rx="14" fill="#1C7FC7" />
      <rect x="24" y="6" width="44" height="44" rx="14" fill="#F0A27A" />
    </g>
    <g id="twin-frame-pair-lg">
      <rect x="0" y="0" width="68" height="68" rx="20" fill="#1C7FC7" />
      <rect x="36" y="9" width="68" height="68" rx="20" fill="#F0A27A" />
    </g>
    <g id="twin-frame-pair-sm">
      <rect x="0" y="0" width="28" height="28" rx="9" fill="#1C7FC7" />
      <rect x="15" y="4" width="28" height="28" rx="9" fill="#F0A27A" />
    </g>
  </defs>

  <g opacity="0.12">
    <!-- Scattered ambient pairs per Menako Studio brand guidelines page 12 -->
    <use href="#twin-frame-pair-lg" x="60" y="80" />
    <use href="#twin-frame-pair-sm" x="220" y="420" />
    <use href="#twin-frame-pair" x="480" y="110" />
    <use href="#twin-frame-pair-sm" x="720" y="360" />
    <use href="#twin-frame-pair-lg" x="980" y="70" />
    <use href="#twin-frame-pair" x="1140" y="380" />
    <use href="#twin-frame-pair-sm" x="1320" y="160" />
  </g>
</svg>